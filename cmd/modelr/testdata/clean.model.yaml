version: "0.2"
name: clean-system
description: A system with safe capacity values
components:
  - name: api
    type: server
    description: API server
    properties:
      max_connections: 100
      min_instances: 1
      max_instances: 2
  - name: db
    type: datastore
    description: Primary database
    properties:
      max_connections: 500
      max_ops_per_sec: 10000
      conn_establish_ms: 20
edges:
  - source: api
    target: db
    operation: read_write
    description: API reads/writes database
    properties:
      avg_operation_ms: 10
relationships:
  - template: capacity_chain
    upstream: api
    downstream: db
