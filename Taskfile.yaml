version: '3'

tasks:
  build:
    desc: Build the modelr binary
    cmds:
      - go build -o bin/modelr ./cmd/modelr

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  lint:
    desc: Run linter
    cmds:
      - go vet ./...

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin/
